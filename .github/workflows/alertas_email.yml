name: StockLab · Alertas por Correo (BME)

on:
  schedule:
    # Cada 20 min de lunes a viernes entre 07:00 y 17:00 UTC
    # (cubre horario BME 09:00-17:45 Madrid todo el año; el script filtra la hora exacta)
    - cron: "*/20 7-17 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular sin enviar correos (true/false)"
        required: false
        default: "false"
      force:
        description: "Ignorar horario BME (true/false)"
        required: false
        default: "false"
      test_email:
        description: "Enviar correo de prueba de conectividad (true/false)"
        required: false
        default: "false"
      test_to_email:
        description: "Correo concreto opcional para prueba multiusuario (ej. amigo@gmail.com)"
        required: false
        default: ""

jobs:
  alertas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout StockLab
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ejecutar motor de alertas por correo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          APP_PUBLIC_URL: ${{ secrets.APP_PUBLIC_URL }}
          INPUT_TEST_TO_EMAIL: ${{ github.event.inputs.test_to_email }}
        run: |
          ARGS=()
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS+=(--force); fi
          if [ "${{ github.event.inputs.test_email }}" = "true" ]; then ARGS+=(--test-email); fi
          if [ -n "$INPUT_TEST_TO_EMAIL" ]; then ARGS+=(--to-email "$INPUT_TEST_TO_EMAIL"); fi
          python enviar_alertas.py "${ARGS[@]}"
