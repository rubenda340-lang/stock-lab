name: StockLab · Resumen Diario al Cierre

on:
  schedule:
    # 17:35 UTC = 18:35 CET (invierno) / 19:35 CEST (verano), lunes a viernes
    - cron: "35 17 * * 1-5"
  workflow_dispatch:

jobs:
  resumen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout StockLab
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Enviar resumen diario de cierre
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          APP_PUBLIC_URL: ${{ secrets.APP_PUBLIC_URL }}
        run: python enviar_alertas.py --resumen-diario --force
