[server]
headless = true
port = 8501
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 5

[client]
showErrorDetails = false
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#38bdf8"
backgroundColor = "#080c15"
secondaryBackgroundColor = "#0f1726"
textColor = "#f1f5f9"
font = "sans serif"
